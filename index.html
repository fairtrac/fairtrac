DEF('💡 Река течёт с севера. Дамба блокирует воду ниже — канал выше дамбы орошает ваши поля.','💡 The river flows from the north. A dam blocks water downstream — a canal above it irrigates your fields.','💡 El río fluye desde el norte. Una presa corta el agua río abajo; un canal por encima riega tus campos.','💡 Der Fluss kommt aus dem Norden. Ein Damm sperrt das Wasser darunter – ein Kanal oberhalb bewässert Ihre Felder.','💡 La rivière vient du nord. Un barrage coupe l’eau en aval — un canal en amont irrigue vos champs.','💡 O rio vem do norte. Uma represa bloqueia a água abaixo; um canal acima irriga seus campos.','💡 Il fiume scorre da nord. Una diga blocca l’acqua a valle: un canale a monte irriga i campi.','💡 Nehir kuzeyden akar. Baraj aşağıdaki suyu keser — barajın üstündeki kanal tarlaları sular.','💡 河水自北向南流。水坝会截断下游的水，坝上游的水渠可灌溉农田。','💡 川は北から流れます。ダムは下流の水を止め、上流の水路が畑を潤します。');

DEF('Вы — старейшина маленькой деревни на берегу реки. Вода течёт с севера на юг; ниже по течению живут Ольховая, кочевники, племя и рыцари Железной Марки. Ходите джойстиком, ведите пальцем по земле при выбранном инструменте. Грядки (🌱) нужна вода рядом (💧 канал от реки). Жители сами сеют и жнут, но семена кончаются — торгуйте. При дворе давно шепчутся об измене: входите в здания (🚪), говорите с советниками — и не верьте всему, что слышите.','You are the elder of a small riverside village. Water flows north to south; downstream live Olkhovaya, the nomads, the tribe and the knights of the Iron March. Walk with the joystick, drag a finger over the ground with a tool selected. Fields (🌱) need water nearby (💧 a canal from the river). Villagers sow and reap by themselves, but seeds run out — trade. At court there are whispers of treason: enter buildings (🚪), talk to advisors — and do not believe everything you hear.','Eres el anciano de una pequeña aldea junto al río. El agua fluye de norte a sur; río abajo viven Olkhovaya, los nómadas, la tribu y los caballeros de la Marca de Hierro. Camina con el joystick y arrastra el dedo sobre el suelo con una herramienta. Los campos (🌱) necesitan agua cerca (💧 un canal del río). Los aldeanos siembran y cosechan solos, pero las semillas se acaban: comercia. En la corte se susurra traición: entra en los edificios (🚪), habla con los consejeros y no creas todo lo que oigas.','Sie sind der Älteste eines kleinen Dorfes am Fluss. Das Wasser fließt von Nord nach Süd; flussabwärts leben Olkhovaya, die Nomaden, der Stamm und die Ritter der Eisernen Mark. Bewegen Sie sich mit dem Joystick und ziehen Sie mit gewähltem Werkzeug den Finger über den Boden. Felder (🌱) brauchen Wasser in der Nähe (💧 Kanal vom Fluss). Die Dorfbewohner säen und ernten selbst, aber die Saat geht aus – handeln Sie. Am Hof flüstert man von Verrat: Betreten Sie Gebäude (🚪), sprechen Sie mit den Beratern – und glauben Sie nicht alles.','Vous êtes l’ancien d’un petit village au bord de la rivière. L’eau coule du nord au sud ; en aval vivent Olkhovaya, les nomades, la tribu et les chevaliers de la Marche de Fer. Déplacez-vous au joystick et faites glisser le doigt sur le sol avec un outil. Les champs (🌱) ont besoin d’eau (💧 canal depuis la rivière). Les villageois sèment et récoltent seuls, mais les graines s’épuisent : commercez. À la cour, on murmure la trahison : entrez dans les bâtiments (🚪), parlez aux conseillers — et ne croyez pas tout.','Você é o ancião de uma pequena aldeia à beira do rio. A água corre de norte a sul; rio abaixo vivem Olkhovaya, os nômades, a tribo e os cavaleiros da Marca de Ferro. Ande com o joystick e arraste o dedo no chão com uma ferramenta. Os campos (🌱) precisam de água perto (💧 canal do rio). Os aldeões semeiam e colhem sozinhos, mas as sementes acabam: negocie. Na corte sussurra-se traição: entre nos prédios (🚪), converse com os conselheiros — e não acredite em tudo.','Sei l’anziano di un piccolo villaggio sul fiume. L’acqua scorre da nord a sud; a valle vivono Olkhovaya, i nomadi, la tribù e i cavalieri della Marca di Ferro. Muoviti con il joystick e trascina il dito sul terreno con uno strumento. I campi (🌱) hanno bisogno di acqua vicina (💧 un canale dal fiume). Gli abitanti seminano e raccolgono da soli, ma i semi finiscono: commercia. A corte si sussurra di tradimento: entra negli edifici (🚪), parla con i consiglieri e non credere a tutto.','Nehir kıyısındaki küçük bir köyün ileri geleni sizsiniz. Su kuzeyden güneye akar; aşağıda Olkhovaya, göçebeler, kabile ve Demir Marka şövalyeleri yaşar. Joystick ile yürüyün, bir araç seçip parmağınızı zeminde sürükleyin. Tarlalar (🌱) yakında su ister (💧 nehirden kanal). Köylüler kendileri eker ve biçer ama tohum biter — ticaret yapın. Sarayda ihanet fısıltıları var: binalara girin (🚪), danışmanlarla konuşun — duyduğunuzun hepsine inanmayın.','你是河边小村庄的长者。河水由北向南流；下游住着奥尔霍瓦亚、游牧民、部落和铁疆骑士。用摇杆行走，选中工具后在地面上滑动手指。农田（🌱）旁需要有水（💧从河里挖渠）。村民会自己播种收割，但种子会用完——要靠交易。朝中流传着叛变的低语：进入建筑（🚪），与顾问交谈——别轻信所有话。','あなたは川辺の小さな村の長老です。水は北から南へ流れ、下流にはオルホヴァヤ、遊牧民、部族、鉄辺境の騎士が暮らします。ジョイスティックで歩き、道具を選んで地面を指でなぞります。畑（🌱）は近くに水が必要です（💧川から水路）。村人は自分で種まきと収穫をしますが、種は尽きます。取引しましょう。宮廷には裏切りの噂があります。建物に入り（🚪）、顧問と話し、聞いたことを鵜呑みにしないでください。');

DEF('Запыхавшийся гонец протягивает свиток: «Мы слышали, вы копаете каналы и ставите дамбы. Вода — общая. Дадите ли слово, что не оставите нас без неё?»','A breathless messenger hands you a scroll: “We hear you dig canals and build dams. Water is shared. Will you give your word not to leave us without it?”','Un mensajero jadeante te entrega un pergamino: «Sabemos que cavas canales y levantas presas. El agua es de todos. ¿Das tu palabra de no dejarnos sin ella?»','Ein atemloser Bote reicht eine Schriftrolle: „Wir hören, Sie graben Kanäle und bauen Dämme. Wasser gehört allen. Geben Sie Ihr Wort, uns nicht ohne Wasser zu lassen?“','Un messager essoufflé tend un parchemin : « On dit que vous creusez des canaux et bâtissez des barrages. L’eau est à tous. Promettez-vous de ne pas nous en priver ? »','Um mensageiro ofegante entrega um pergaminho: «Soubemos que você cava canais e faz represas. A água é de todos. Dá sua palavra de não nos deixar sem ela?»','Un messaggero trafelato porge una pergamena: «Sappiamo che scavi canali e costruisci dighe. L’acqua è di tutti. Prometti di non lasciarci senza?»','Nefes nefese bir haberci parşömen uzatır: «Kanal kazıp baraj yaptığınızı duyduk. Su herkesindir. Bizi susuz bırakmayacağınıza söz verir misiniz?»','一名气喘吁吁的信使递上卷轴：“听说你们挖渠筑坝。水是大家的。你能保证不让我们断水吗？”','息を切らした使者が巻物を差し出す。「あなた方が水路を掘りダムを築くと聞いた。水は皆のもの。我らから水を奪わないと約束してくれるか？」');
